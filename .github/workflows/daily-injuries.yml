name: Daily injuries

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-injuries.yml
      - backend/scripts/daily_injuries.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb numpy httpx
      - run: python src/backend/scripts/daily_injuries.py site/snapshot
        env:
          PYTHONPATH: src/backend
      - name: Publish if anything changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/team-news.json
          git commit -m "Update injuries" && git push || echo "No change"
